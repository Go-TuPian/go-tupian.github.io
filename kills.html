<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全局击杀 · TACZ</title>
<meta name="description" content="TACZ PVP 服务器全局击杀流水与排行榜。">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="flex min-h-screen flex-col bg-ink text-slate-200 font-sans antialiased">

<div class="fixed inset-0 -z-10 grid-bg pointer-events-none"></div>
<div class="fixed inset-x-0 top-0 -z-10 h-[420px] bg-[radial-gradient(ellipse_at_top,rgba(251,191,36,.09),transparent_65%)] pointer-events-none"></div>

<div id="site-header"></div>

<main class="mx-auto w-full max-w-7xl flex-1 px-4 pb-16 pt-8 sm:px-5 lg:px-8">

  <div id="mock-banner" class="mb-6 hidden flex-wrap items-center gap-x-3 gap-y-1 rounded-lg border border-amber-400/25 bg-amber-400/[0.06] px-4 py-3 text-xs text-amber-200/90"></div>

  <!-- 标题 -->
  <section class="mb-7">
    <div class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
      <div class="min-w-0">
        <div class="mb-2 flex items-center gap-2 text-[11px] font-medium tracking-[0.22em] text-slate-500">
          <span class="h-px w-8 bg-ember/50"></span>
          KILL FEED
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">全局击杀流水</h1>
        <p id="feed-subtitle" class="mt-2 max-w-2xl text-sm text-slate-400">按时间倒序 · 每 20 秒自动刷新</p>
      </div>

      <div class="grid shrink-0 grid-cols-2 gap-3 sm:grid-cols-4">
        <div class="rounded-lg border border-white/[0.06] bg-panel/70 px-4 py-3">
          <div class="text-[10px] tracking-widest text-slate-500">TOTAL KILLS</div>
          <div id="kpi-total" class="mt-1 num text-xl font-bold text-white">—</div>
        </div>
        <div class="rounded-lg border border-white/[0.06] bg-panel/70 px-4 py-3">
          <div class="text-[10px] tracking-widest text-slate-500">HEADSHOT</div>
          <div id="kpi-hs" class="mt-1 num text-xl font-bold text-ember">—</div>
        </div>
        <div class="rounded-lg border border-white/[0.06] bg-panel/70 px-4 py-3">
          <div class="text-[10px] tracking-widest text-slate-500">FIGHTERS</div>
          <div id="kpi-fighters" class="mt-1 num text-xl font-bold text-white">—</div>
        </div>
        <div class="rounded-lg border border-white/[0.06] bg-panel/70 px-4 py-3">
          <div class="text-[10px] tracking-widest text-slate-500">ONLINE</div>
          <div id="kpi-online" class="mt-1 num text-xl font-bold text-slate-400">—</div>
        </div>
      </div>
    </div>
  </section>

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">

    <!-- 流水 -->
    <section class="lg:col-span-8">
      <div class="card hairline overflow-hidden rounded-xl border border-white/[0.07]">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-white/[0.06] px-5 py-4">
          <div class="flex items-center gap-2">
            <span class="relative flex h-2 w-2">
              <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-ember opacity-50"></span>
              <span class="relative inline-flex h-2 w-2 rounded-full bg-ember"></span>
            </span>
            <span class="text-sm font-semibold text-white">实时记录</span>
            <span id="feed-count" class="rounded border border-white/10 bg-white/[0.03] px-2 py-0.5 text-[10px] text-slate-400">载入中</span>
          </div>

          <div class="flex items-center gap-2 text-[10px]">
            <span id="live-flag" class="text-slate-600">更新于 —</span>
            <span class="h-3 w-px bg-white/10"></span>
            <div id="limit-switch" class="flex items-center gap-1"></div>
          </div>
        </div>

        <div class="relative">
          <div id="feed-list" class="max-h-[760px] overflow-y-auto">
            <div class="px-5 py-20 text-center text-sm text-slate-500">载入中…</div>
          </div>
          <div class="pointer-events-none absolute inset-x-0 bottom-0 h-14 bg-gradient-to-t from-[#0e1117] via-[#0e1117]/70 to-transparent"></div>
        </div>
      </div>

      <div class="mt-4 flex flex-wrap items-center justify-between gap-2 px-1 text-[11px] text-slate-600">
        <span>点击玩家名可跳转到他的个人战绩</span>
        <span id="api-base-label" class="font-mono"></span>
      </div>
    </section>

    <!-- 排行榜 -->
    <aside class="lg:col-span-4">
      <div class="space-y-4 lg:sticky lg:top-24">

        <div class="card hairline overflow-hidden rounded-xl border border-white/[0.07]">
          <div class="border-b border-white/[0.06] px-5 py-4">
            <div class="text-[10px] tracking-[0.22em] text-slate-500">LEADERBOARD</div>
            <h2 class="mt-0.5 text-base font-bold text-white">击杀榜</h2>
          </div>
          <div id="board" class="divide-y divide-white/[0.04]">
            <div class="px-5 py-12 text-center text-sm text-slate-500">载入中…</div>
          </div>
        </div>

        <div class="rounded-xl border border-white/[0.06] bg-panel/50 px-4 py-3 text-[11px] leading-relaxed text-slate-500">
          <div class="mb-1 text-[10px] tracking-[0.2em] text-slate-600">数据说明</div>
          流水只保留后端收到的击杀事件；头像取自玩家皮肤，可在
          <code class="rounded bg-black/30 px-1 py-0.5 font-mono text-slate-400">skins/</code> 放
          <code class="rounded bg-black/30 px-1 py-0.5 font-mono text-slate-400">玩家名.png</code> 覆盖。
        </div>
      </div>
    </aside>
  </div>
</main>

<footer class="border-t border-white/[0.05] py-6">
  <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-2 px-4 text-[11px] text-slate-600 sm:flex-row sm:px-5 lg:px-8">
    <span id="footer-site">TACZ</span>
    <span id="footer-stamp">Last snapshot —</span>
  </div>
</footer>

<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/skin.js"></script>
<script src="assets/kills.js"></script>
</body>
</html>
